name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write
  pull-requests: read

jobs:
  guard:
    runs-on: ubuntu-latest
    outputs:
      should_deploy: ${{ steps.check.outputs.should_deploy }}
    steps:
      - name: Check if push comes from merged PR dev -> main
        id: check
        uses: actions/github-script@v7
        with:
          script: |
            const { owner, repo } = context.repo
            const commit_sha = context.sha

            const response = await github.rest.repos.listPullRequestsAssociatedWithCommit({
              owner,
              repo,
              commit_sha,
            })

            const shouldDeploy = response.data.some((pr) => {
              return pr.merged_at && pr.base.ref === 'main' && pr.head.ref === 'dev'
            })

            core.setOutput('should_deploy', shouldDeploy ? 'true' : 'false')

            if (shouldDeploy) {
              core.notice(`Deploy enabled for commit ${commit_sha} from merged PR dev -> main.`)
            } else {
              core.notice('Skipping deploy because this push is not associated with a merged PR from dev to main.')
            }

  build:
    needs: guard
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install, build and upload site
        uses: withastro/action@v3
        with:
          node-version: 22

  deploy:
    needs:
      - guard
      - build
    if: needs.guard.outputs.should_deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
